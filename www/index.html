<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#12151c">
  <title>Parking Pro 3D</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="c"></canvas>

  <!-- Menú principal -->
  <div id="menu" class="screen">
    <div class="top-right"><div class="coins"><span class="coin-ico"></span><span class="coinCount">0</span></div></div>
    <div class="title">
      <h1>PARKING<span>PRO 3D</span></h1>
      <p>Aparca sin chocar. ¿Eres el mejor conductor?</p>
    </div>
    <div class="menu-buttons">
      <button class="btn big primary" id="btnPlay">▶ Niveles</button>
      <button class="btn big" id="btnFree">🏙️ Ciudad libre</button>
      <button class="btn big" id="btnGarage">🚗 Garaje</button>
      <button class="btn small ghost" id="btnSound">🔊 Sonido</button>
    </div>
  </div>

  <!-- Selección de nivel -->
  <div id="levels" class="screen hidden panel-screen">
    <div class="bar">
      <button class="btn small" data-back>← Volver</button>
      <h2>Niveles</h2>
      <div class="coins"><span class="coin-ico"></span><span class="coinCount">0</span></div>
    </div>
    <div id="levelGrid"></div>
  </div>

  <!-- Garaje -->
  <div id="garage" class="screen hidden">
    <div class="bar">
      <button class="btn small" data-back>← Volver</button>
      <h2>Garaje</h2>
      <div class="coins"><span class="coin-ico"></span><span class="coinCount">0</span></div>
    </div>
    <div class="garage-bottom">
      <div class="car-select">
        <button class="btn round" id="carPrev">‹</button>
        <div class="car-info">
          <h3 id="carName"></h3>
          <div id="carSub"></div>
          <div id="carStats"></div>
        </div>
        <button class="btn round" id="carNext">›</button>
      </div>
      <div id="colorRow"></div>
      <button class="btn big primary" id="carAction"></button>
      <div class="garage-extra">
        <button class="btn" id="btnTune">🔧 Taller</button>
        <button class="btn" id="btnRev">🔊 Escuchar motor</button>
      </div>
    </div>
  </div>

  <!-- Taller: piezas para el coche que estás viendo en el garaje -->
  <div id="tuning" class="screen hidden">
    <div class="bar">
      <button class="btn small" id="tuneBack">← Garaje</button>
      <h2>Taller</h2>
      <div class="coins"><span class="coin-ico"></span><span class="coinCount">0</span></div>
    </div>
    <div class="garage-bottom tune-panel">
      <h3 id="tuneCar"></h3>
      <div id="tuneTabs"></div>
      <div id="tuneOptions"></div>
      <p id="tuneInfo"></p>
    </div>
  </div>

  <!-- HUD de conducción -->
  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="hud-info">
        <div id="hudLevel"></div>
        <div id="hudTimer"></div>
      </div>
      <div id="hint"></div>
      <div class="hud-btns">
        <button class="btn icon" id="btnCam" aria-label="Cámara">🎥</button>
        <button class="btn icon" id="btnPause" aria-label="Pausa">⏸</button>
      </div>
    </div>
    <div id="sensor"><span></span><span></span><span></span><span></span><span></span></div>
    <div id="parkBar"><div></div></div>
    <div id="rotate">📱 Gira el móvil en horizontal para jugar mejor</div>

    <div id="wheel">
      <svg viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="44" fill="none" stroke="#1b1f27" stroke-width="10"/>
        <circle cx="50" cy="50" r="44" fill="none" stroke="#3a414f" stroke-width="5"/>
        <path d="M8 50 H40 M60 50 H92 M50 60 V93" stroke="#1b1f27" stroke-width="9" stroke-linecap="round"/>
        <circle cx="50" cy="50" r="13" fill="#1b1f27"/>
        <circle cx="50" cy="50" r="6" fill="#ffb400"/>
        <rect x="47" y="2" width="6" height="10" rx="2" fill="#ffb400"/>
      </svg>
    </div>

    <div id="speedo"><span id="spd">0</span><small>km/h · <b id="gearTxt">D1</b></small><div id="rpmBar"><div></div></div></div>

    <div id="pedals">
      <div class="pedal-col">
        <button class="btn gear" id="btnGear">D</button>
        <button class="btn hand" id="btnHand">P</button>
      </div>
      <button class="pedal brake" id="pedBrake">FRENO</button>
      <button class="pedal gas" id="pedGas">GAS</button>
    </div>
  </div>

  <!-- Ventana modal -->
  <div id="modal" class="hidden">
    <div class="card">
      <h2 id="mTitle"></h2>
      <div id="mStars"></div>
      <p id="mText"></p>
      <div id="mButtons"></div>
    </div>
  </div>

  <!-- Modo admin: se abre tocando 5 veces el título del menú -->
  <div id="admin" class="hidden">
    <div class="card admin-card">
      <div id="adminLock">
        <h2>Modo admin</h2>
        <p class="admin-note">Introduce el PIN de administrador</p>
        <input id="adminPin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" aria-label="PIN">
        <p id="adminErr" class="admin-err"></p>
        <div class="admin-row">
          <button class="btn" id="adminCancel">Cancelar</button>
          <button class="btn primary" id="adminEnter">Entrar</button>
        </div>
      </div>
      <div id="adminBody" class="hidden">
        <h2>Panel de admin</h2>
        <p id="adminStatus" class="admin-note"></p>
        <div class="admin-grid">
          <button class="btn" data-admin="add10k">+10.000 monedas</button>
          <button class="btn" data-admin="add100k">+100.000 monedas</button>
          <button class="btn" data-admin="million">Poner 1.000.000</button>
          <button class="btn" data-admin="cars">Dar todos los coches</button>
          <button class="btn" data-admin="parts">Dar todas las piezas</button>
          <button class="btn" data-admin="levels">Desbloquear niveles ★★★</button>
          <button class="btn" data-admin="god" id="adminGod"></button>
        </div>
        <div class="admin-row">
          <input id="adminNewPin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="Nuevo PIN" aria-label="Nuevo PIN">
          <button class="btn" id="adminSavePin">Cambiar PIN</button>
        </div>
        <div class="admin-row">
          <button class="btn danger" id="adminReset">Reiniciar partida</button>
          <button class="btn primary" id="adminClose">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
