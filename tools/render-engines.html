<!doctype html>
<!-- Graba un bucle de 2 s de cada tipo de motor (a 3000 rpm, con gas) con el sintetizador del juego.
     En Roblox el sonido se reproduce en bucle y su PlaybackSpeed = rpm / 3000.
     Servir la raíz del repositorio y abrir /tools/render-engines.html: window.rendered tiene un WAV por motor. -->
<html><head><meta charset="utf-8"><title>Grabar motores</title></head>
<body>
<script type="module">
import { EngineSound, VOICES } from '../www/js/engine-sound.js';

const RATE = 44100, BASE_RPM = 3000, LOOP = 2, FADE = 0.05;
const RED = { i4: 6200, v6: 4800, v8: 5200, v6tt: 7000, i6t: 7200, f6: 9000, v12: 9250 };

function wav(samples) {
  const buf = new ArrayBuffer(44 + samples.length * 2);
  const v = new DataView(buf);
  const str = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  str(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); str(8, 'WAVEfmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, RATE, true); v.setUint32(28, RATE * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, 'data'); v.setUint32(40, samples.length * 2, true);
  samples.forEach((s, i) => v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, s)) * 32767, true));
  const bytes = new Uint8Array(buf);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

window.rendered = {};
for (const voice of Object.keys(VOICES)) {
  const ctx = new OfflineAudioContext(1, RATE * (LOOP + 1), RATE);
  const eng = new EngineSound(ctx, ctx.destination);
  eng.setVoice(voice);
  eng.update(true, BASE_RPM, RED[voice], 0.7);
  const data = (await ctx.startRendering()).getChannelData(0);
  // Toma 2 s estables y funde el final con el principio para que el bucle no haga "clic".
  const start = RATE * 0.8, n = RATE * LOOP, f = RATE * FADE;
  const out = new Float32Array(n);
  for (let i = 0; i < n; i++) out[i] = data[start + i];
  for (let i = 0; i < f; i++) {
    const t = i / f;
    out[i] = out[i] * t + data[start + n + i] * (1 - t);
  }
  let peak = 0;
  for (const s of out) peak = Math.max(peak, Math.abs(s));
  for (let i = 0; i < n; i++) out[i] *= 0.9 / peak;
  window.rendered[voice] = wav(Array.from(out));
}
document.title = 'listo';
</script>
</body></html>
