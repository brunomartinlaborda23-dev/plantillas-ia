<title>Liga Fantasy del Vestuario</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: marcador arriba, pestañas, una columna de contenido; el campo de césped es la pieza protagonista de "Mi equipo". */
:root {
  --bg: #edf1ea;
  --surface: #ffffff;
  --surface-2: #f5f8f3;
  --ink: #12211a;
  --muted: #5a6a61;
  --line: #d4ddd3;
  --grass: #1e7442;
  --grass-dark: #175c34;
  --chalk: #f3f8f1;
  --card: #e6c11d;
  --card-ink: #2b2405;
  --good: #1c7a3f;
  --bad: #b8322a;
  --scoreboard: #12211a;
  --scoreboard-ink: #f3f8f1;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1511; --surface: #14211a; --surface-2: #192920; --ink: #e5eee7; --muted: #94a79b; --line: #26382e;
    --grass: #1b6a3c; --grass-dark: #14532e; --chalk: #e9f2ea; --card: #edcc2c; --card-ink: #231d03;
    --good: #4fbf78; --bad: #ef6b5f; --scoreboard: #060c09; --scoreboard-ink: #e9f2ea; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1511; --surface: #14211a; --surface-2: #192920; --ink: #e5eee7; --muted: #94a79b; --line: #26382e;
  --grass: #1b6a3c; --grass-dark: #14532e; --chalk: #e9f2ea; --card: #edcc2c; --card-ink: #231d03;
  --good: #4fbf78; --bad: #ef6b5f; --scoreboard: #060c09; --scoreboard-ink: #e9f2ea; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--scoreboard); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--card); outline-offset: 2px; }
.wrap { max-width: 960px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-variant-numeric: tabular-nums; }

/* Marcador */
header.top { background: var(--scoreboard); color: var(--scoreboard-ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.top .wrap { display: flex; flex-direction: column; gap: 10px; padding-block: 14px 0; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: clamp(26px, 5vw, 36px); line-height: 1; text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
.brand h1 span { color: var(--card); }
.brand .sub { font-size: 13px; opacity: .75; letter-spacing: .04em; text-transform: uppercase; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs a { flex: 0 0 auto; padding: 10px 14px 11px; color: inherit; text-decoration: none; font-family: var(--f-display); font-weight: 700; font-size: 17px; letter-spacing: .04em; text-transform: uppercase; opacity: .6; border-bottom: 3px solid transparent; }
nav.tabs a[aria-current="page"] { opacity: 1; border-bottom-color: var(--card); }
nav.tabs a:hover { opacity: 1; }

main { padding-block: 22px 60px; display: flex; flex-direction: column; gap: 22px; }
h2 { font-family: var(--f-display); font-weight: 800; font-size: 26px; line-height: 1.05; margin: 0; text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
h3 { font-family: var(--f-display); font-weight: 700; font-size: 19px; margin: 0; text-transform: uppercase; letter-spacing: .03em; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.section { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; align-items: start; }
.grid2 > * { min-width: 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; text-decoration: none; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--grass); border-color: var(--grass); color: var(--chalk); }
.btn.primary:hover { background: var(--grass-dark); }
.btn.danger { color: var(--bad); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.field input, .field select, .field textarea { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; }
.field textarea { min-height: 130px; resize: vertical; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }

/* Tablas */
.tablebox { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
th { font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); }
td.r, th.r { text-align: right; }
.rank { font-family: var(--f-display); font-weight: 800; font-size: 20px; width: 40px; }
tr.me td { background: color-mix(in srgb, var(--card) 14%, transparent); }
.big { font-family: var(--f-display); font-weight: 800; font-size: 22px; }

/* Ficha de jugador (avatar) */
.av { --size: 40px; width: var(--size); height: var(--size); border-radius: 50%; flex: 0 0 auto; display: grid; place-items: center; background: var(--grass); color: var(--chalk); font-family: var(--f-display); font-weight: 800; font-size: calc(var(--size) * .42); overflow: hidden; border: 2px solid var(--surface); }
.av img { width: 100%; height: 100%; object-fit: cover; }
.pos { display: inline-block; min-width: 38px; text-align: center; font-size: 11px; font-weight: 700; letter-spacing: .06em; padding: 2px 6px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); }
.pos.POR { background: color-mix(in srgb, var(--card) 30%, var(--surface)); }
.pos.DEF { background: color-mix(in srgb, #3a7bd5 22%, var(--surface)); }
.pos.MED { background: color-mix(in srgb, var(--grass) 25%, var(--surface)); }
.pos.DEL { background: color-mix(in srgb, var(--bad) 22%, var(--surface)); }
.who { display: flex; gap: 10px; align-items: center; min-width: 0; }
.who b { display: block; overflow: hidden; text-overflow: ellipsis; }
.who small { color: var(--muted); }

/* Campo */
.pitch { position: relative; border-radius: 14px; overflow: hidden; padding: 22px 10px; display: flex; flex-direction: column; gap: 18px; min-height: 460px; justify-content: space-around;
  background: repeating-linear-gradient(180deg, var(--grass) 0 56px, var(--grass-dark) 56px 112px); }
.pitch::before, .pitch::after { content: ""; position: absolute; pointer-events: none; border: 2px solid color-mix(in srgb, var(--chalk) 55%, transparent); }
.pitch::before { inset: 10px; border-radius: 4px; background: linear-gradient(transparent calc(50% - 1px), color-mix(in srgb, var(--chalk) 55%, transparent) calc(50% - 1px) calc(50% + 1px), transparent calc(50% + 1px)); }
.pitch::after { width: 110px; height: 110px; border-radius: 50%; left: calc(50% - 55px); top: calc(50% - 55px); }
.line { position: relative; z-index: 1; display: flex; justify-content: space-evenly; gap: 6px; }
.slot { width: 84px; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; padding: 0; cursor: pointer; color: var(--chalk); }
.slot .av { --size: 54px; box-shadow: 0 3px 10px rgb(0 0 0 / .3); border-color: var(--chalk); }
.slot.empty .av { background: color-mix(in srgb, var(--chalk) 18%, transparent); border-style: dashed; font-size: 26px; }
.slot .tag { background: var(--scoreboard); color: var(--scoreboard-ink); font-size: 12px; font-weight: 600; padding: 2px 7px; border-radius: 4px; max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot .price { font-size: 11px; font-weight: 700; opacity: .9; }
.slot .cap { position: absolute; transform: translate(20px, -4px); background: var(--card); color: var(--card-ink); font-weight: 800; font-size: 12px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; }
.slot .avwrap { position: relative; display: grid; place-items: center; }

.budget { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); }
.budget div { background: var(--surface); padding: 10px 12px; }
.budget b { display: block; font-family: var(--f-display); font-size: 24px; font-weight: 800; }
.over b { color: var(--bad); }

/* Partido / jornada */
.match { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.score { font-family: var(--f-display); font-weight: 800; font-size: 40px; line-height: 1; background: var(--scoreboard); color: var(--scoreboard-ink); padding: 6px 14px; border-radius: 8px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); letter-spacing: .03em; }
.chip.win { color: var(--good); border-color: currentColor; }
.chip.loss { color: var(--bad); border-color: currentColor; }
.chip.lock { background: var(--card); color: var(--card-ink); border-color: var(--card); }
.pts { font-family: var(--f-display); font-weight: 800; font-size: 20px; }
.pts.neg { color: var(--bad); }
@media (max-width: 560px) { .hide-sm { display: none; } }
.trend { font-size: 11px; font-weight: 700; white-space: nowrap; }
.trend.up { color: var(--good); }
.trend.down { color: var(--bad); }
.yc { display: inline-block; width: 9px; height: 13px; border-radius: 2px; background: var(--card); vertical-align: -2px; }
.rc { display: inline-block; width: 9px; height: 13px; border-radius: 2px; background: var(--bad); vertical-align: -2px; }

.list { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item > :first-child { min-width: 0; }
.clickable { cursor: pointer; }
.clickable:hover { background: var(--surface-2); }

.empty { text-align: center; padding: 36px 16px; border: 2px dashed var(--line); border-radius: var(--r); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty p { margin: 0; max-width: 46ch; }
.note { padding: 10px 12px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); font-size: 14px; }
.note.warn { border-color: var(--card); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 7px 12px; cursor: pointer; font-weight: 600; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* Editor de jornada */
.stats td { padding: 6px 8px; }
.stats input[type="number"] { width: 54px; padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); }
.stats input[type="checkbox"] { width: 18px; height: 18px; }

/* Hoja modal */
.overlay { position: fixed; inset: 0; background: rgb(5 10 8 / .55); z-index: 20; display: flex; align-items: flex-end; justify-content: center; padding-top: max(40px, env(safe-area-inset-top, 0px)); }
.sheet { background: var(--surface); width: min(560px, 100%); max-height: 100%; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 640px) { .overlay { align-items: center; } .sheet { border-radius: 16px; max-height: 86vh; } }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 30; font-weight: 600; max-width: calc(100% - 32px); }
.rules { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; font-size: 14px; }
.rules span:nth-child(even) { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: no-preference) { .slot .av { transition: transform .15s; } .slot:hover .av { transform: translateY(-2px); } }
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1 id="leagueName">Liga <span>Fantasy</span></h1>
      <div class="sub" id="leagueSub">Cargando…</div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Secciones">
      <a href="#inicio">Clasificación</a>
      <a href="#equipo">Mi equipo</a>
      <a href="#mercado">Mercado</a>
      <a href="#jornadas">Jornadas</a>
      <a href="#reglas">Puntos</a>
      <a href="#admin" id="tabAdmin" hidden>Admin</a>
    </nav>
  </div>
</header>
<main class="wrap" id="view">
  <div class="empty"><h3>Cargando la liga</h3><p class="muted">Aquí aparecerán la clasificación, los equipos y las jornadas de vuestra liga.</p></div>
</main>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
(() => {
// ---------- Reglas del juego ----------
const POS = {
  POR: { n: "Portero", gol: 6, cero: 4, encaja: true },
  DEF: { n: "Defensa", gol: 6, cero: 4, encaja: true },
  MED: { n: "Centrocampista", gol: 5, cero: 1, encaja: false },
  DEL: { n: "Delantero", gol: 4, cero: 0, encaja: false },
};
const POS_ORDER = ["POR", "DEF", "MED", "DEL"];
const FORMATOS = {
  f5:  { label: "Fútbol sala (1-1-2-1)", slots: { POR: 1, DEF: 1, MED: 2, DEL: 1 } },
  f7:  { label: "Fútbol 7 (1-2-2-2)",    slots: { POR: 1, DEF: 2, MED: 2, DEL: 2 } },
  f8:  { label: "Fútbol 8 (1-3-2-2)",    slots: { POR: 1, DEF: 3, MED: 2, DEL: 2 } },
  f11: { label: "Fútbol 11 (1-4-4-2)",   slots: { POR: 1, DEF: 4, MED: 4, DEL: 2 } },
};
const DEFAULT_CFG = { name: "Liga Fantasy Colmenar Viejo", club: "Colmenar Viejo Cadete D", formato: "f11", budget: 30 };
const VALUE_PER_POINT = 0.1; // cada punto por encima de 3 en una jornada sube 100.000 € el valor

const S = {
  db: null, user: null, assets: null, uid: null, owner: false, canWrite: null,
  cfg: null, players: {}, mds: {}, teams: {}, signups: {}, profiles: {}, join: null,
  loaded: { cfg: false, players: false, mds: false, teams: false, signups: false }, offline: false, noDb: false,
  draft: null, modal: null, mdDraft: {}, newPlayer: null, setup: null, marketPos: "ALL", marketSort: "pts",
  openMd: null, pending: false, saving: false,
};
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rid = (p) => p + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const money = (n) => (Math.round((+n || 0) * 10) / 10).toLocaleString("es-ES", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + " M";
const cfg = () => ({ ...DEFAULT_CFG, ...(S.cfg || {}) });
const slots = () => (FORMATOS[cfg().formato] || FORMATOS.f7).slots;
const totalSlots = () => Object.values(slots()).reduce((a, b) => a + b, 0);
const route = () => { const h = location.hash.slice(1); return ["inicio", "equipo", "mercado", "jornadas", "reglas", "admin"].includes(h) ? h : "inicio"; };

function toast(msg) {
  const el = document.createElement("div"); el.className = "toast"; el.textContent = msg; el.setAttribute("role", "status");
  $("#toastRoot").replaceChildren(el); setTimeout(() => el.remove(), 2600);
}

// ---------- Puntuación ----------
function hasResult(md) { return md && md.gf !== null && md.gf !== undefined && md.gf !== "" && md.ga !== null && md.ga !== undefined && md.ga !== ""; }
function breakdown(p, md) {
  const s = md?.stats?.[p.id]; const out = [];
  if (!p || !s || !s.played || !hasResult(md)) return out;
  const r = POS[p.pos] || POS.MED; const gf = +md.gf, ga = +md.ga;
  out.push(["Jugó", 2]);
  if (gf > ga) out.push(["Victoria", 1]);
  if (s.goals) out.push([`${s.goals} gol${s.goals > 1 ? "es" : ""}`, s.goals * r.gol]);
  if (s.assists) out.push([`${s.assists} asistencia${s.assists > 1 ? "s" : ""}`, s.assists * 3]);
  if (ga === 0 && r.cero) out.push(["Portería a cero", r.cero]);
  if (r.encaja && ga >= 2) out.push([`${ga} goles encajados`, -Math.floor(ga / 2)]);
  if (s.saves && p.pos === "POR") out.push([`${s.saves} paradas`, Math.floor(s.saves / 3)]);
  if (s.mvp) out.push(["MVP del partido", 3]);
  if (s.yellow) out.push([`${s.yellow} amarilla${s.yellow > 1 ? "s" : ""}`, -s.yellow]);
  if (s.red) out.push(["Roja", -3]);
  if (s.og) out.push([`${s.og} en propia`, -2 * s.og]);
  if (s.penMiss) out.push([`${s.penMiss} penalti fallado`, -2 * s.penMiss]);
  if (+s.bonus) out.push(["Bonus del míster", +s.bonus]);
  return out;
}
const playerPts = (p, md) => breakdown(p, md).reduce((a, [, v]) => a + v, 0);
const mdList = () => Object.values(S.mds).sort((a, b) => (a.number || 0) - (b.number || 0));
const scoredMds = () => mdList().filter(hasResult);
const seasonPts = (p) => scoredMds().reduce((a, md) => a + playerPts(p, md), 0);
function mdDelta(p, md) {
  if (!md?.stats?.[p.id]?.played || !hasResult(md)) return 0;
  return Math.round((playerPts(p, md) - 3) * VALUE_PER_POINT * 10) / 10;
}
function priceOf(p) {
  if (!p) return 0; let v = +p.price || 0;
  for (const md of scoredMds()) v = Math.max(0.5, v + mdDelta(p, md));
  return Math.round(v * 10) / 10;
}
function lastDelta(p) { const md = scoredMds().filter((m) => m.stats?.[p.id]?.played).slice(-1)[0]; return md ? mdDelta(p, md) : null; }
function trend(p) {
  const d = lastDelta(p); if (d === null || d === 0) return "";
  return `<span class="trend ${d > 0 ? "up" : "down"}">${d > 0 ? "▲" : "▼"} ${money(Math.abs(d))}</span>`;
}
function lineupFor(md, uid) { return md?.lineups?.[uid] || null; }
function managerMdPts(md, uid) {
  const lu = lineupFor(md, uid); if (!lu || !hasResult(md)) return null;
  let t = 0;
  for (const pid of lu.players || []) { const p = S.players[pid] || lu.snap?.[pid]; if (!p) continue; const v = playerPts({ ...p, id: pid }, md); t += pid === lu.captain ? v * 2 : v; }
  return t;
}
function managerTotal(uid) { return scoredMds().reduce((a, md) => a + (managerMdPts(md, uid) || 0), 0); }

// ---------- Datos ----------
const isTyping = () => { const a = document.activeElement; return a && $("#view").contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName) || (a && $("#modalRoot").contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)); };
let raf = 0;
function schedule() {
  if (isTyping()) { S.pending = true; return; }
  cancelAnimationFrame(raf); raf = requestAnimationFrame(render);
}
document.addEventListener("focusout", () => setTimeout(() => { if (S.pending && !isTyping()) { S.pending = false; schedule(); } }, 250));

async function resolveProfiles() {
  if (!S.user?.profiles) return;
  const ids = Object.keys(S.teams).filter((id) => !S.profiles[id]);
  if (!ids.length) return;
  try { const ps = await S.user.profiles(ids); Object.assign(S.profiles, ps); schedule(); } catch {}
}
const managerName = (uid) => S.signups[uid]?.name || S.players[uid]?.name || S.profiles[uid]?.name || (uid === S.uid ? "Tú" : "Mánager");
const started = () => S.cfg?.started === true;

async function boot() {
  const timer = setTimeout(() => { if (!allLoaded()) { S.offline = true; schedule(); } }, 10000);
  let db = null, user = null;
  try { [db, user] = await Promise.all([window.claude?.use?.("db"), window.claude?.use?.("user")]); } catch {}
  S.db = db; S.user = user;
  if (!db) { clearTimeout(timer); S.noDb = true; render(); return; }
  try { S.uid = (await user?.id?.()) || null; } catch {}
  try { S.owner = !!(await user?.isOwner?.()); } catch {}
  try { S.canWrite = await user?.can?.("data.write"); } catch { S.canWrite = null; }
  $("#tabAdmin").hidden = !S.owner;
  try { window.claude.use("assets").then((a) => { S.assets = a; }); } catch {}
  const done = (k) => { S.loaded[k] = true; if (allLoaded()) { clearTimeout(timer); S.offline = false; } schedule(); };
  const fail = (k) => () => { S.loaded[k] = true; S.offline = true; schedule(); };
  db.doc("league/config").onSnapshot((d) => { S.cfg = d.exists ? d.data() : null; if (!d.metadata.fromCache) done("cfg"); else schedule(); }, fail("cfg"));
  db.collection("players").onSnapshot((q) => { S.players = {}; q.docs.forEach((d) => { S.players[d.id] = { ...d.data(), id: d.id }; }); if (!q.metadata.fromCache) done("players"); else schedule(); }, fail("players"));
  db.collection("matchdays").onSnapshot((q) => { S.mds = {}; q.docs.forEach((d) => { S.mds[d.id] = { ...d.data(), id: d.id }; }); if (!q.metadata.fromCache) done("mds"); else schedule(); }, fail("mds"));
  db.collection("signups").onSnapshot((q) => { S.signups = {}; q.docs.forEach((d) => { S.signups[d.id] = { ...d.data(), id: d.id }; }); if (!q.metadata.fromCache) done("signups"); else schedule(); }, fail("signups"));
  db.collection("teams").onSnapshot((q) => { S.teams = {}; q.docs.forEach((d) => { S.teams[d.id] = { ...d.data(), id: d.id }; }); resolveProfiles(); if (!q.metadata.fromCache) done("teams"); else schedule(); }, fail("teams"));
}
const allLoaded = () => Object.values(S.loaded).every(Boolean);

// ---------- Componentes ----------
function initials(name) { return String(name || "?").trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join("").toUpperCase(); }
function avatar(p, size) {

}

function ptsEl(v) { return `<span class="pts num ${v < 0 ? "neg" : ""}">${v}</span>`; }

function statusNote() {

      <p class="muted" style="margin:0;font-size:13px">Todos empiezan valiendo lo mismo y el mercado los irá separando según puntúen. Si alguien se apunta tarde, lo podrás añadir desde Admin.</p>

function standings() {
  return Object.values(S.teams).map((t) => {
    const last = scoredMds().filter((md) => lineupFor(md, t.id)).slice(-1)[0];

  }).sort((a, b) => b.total - a.total || (a.t.name || "").localeCompare(b.t.name || ""));
}

function fmtDate(d) { if (!d) return "Fecha por decidir"; try { return new Date(d + "T12:00:00").toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long" }); } catch { return d; } }

function myTeam() { return S.uid ? S.teams[S.uid] : null; }
function teamMoves(t) { return t?.moves || (t?.players || []).map((pid) => ({ t: "buy", pid, price: +S.players[pid]?.price || 0 })); }
function cashOf(moves) { return Math.round((cfg().budget - moves.reduce((a, m) => a + (m.t === "buy" ? +m.price : -m.price), 0)) * 10) / 10; }
function teamValue(ids) { return ids.reduce((a, id) => a + priceOf(S.players[id]), 0); }
function ensureDraft() {
  const t = myTeam();
  if (!S.draft || S.draft.base !== (t?.updatedAt || "new")) {
    const moves = teamMoves(t);
    S.draft = { base: t?.updatedAt || "new", name: t?.name || "", players: [...(t?.players || [])].filter((id) => S.players[id]), captain: t?.captain || null, moves: [...moves], baseLen: moves.length, dirty: false };
  }
  return S.draft;
}
function draftBuy(d, pid) {
  const i = d.moves.findIndex((m, k) => k >= d.baseLen && m.pid === pid && m.t === "sell");
  if (i >= 0) d.moves.splice(i, 1); else d.moves.push({ t: "buy", pid, price: priceOf(S.players[pid]) });
  d.players.push(pid);
}
function draftSell(d, pid) {
  const i = d.moves.findIndex((m, k) => k >= d.baseLen && m.pid === pid && m.t === "buy");
  if (i >= 0) d.moves.splice(i, 1); else d.moves.push({ t: "sell", pid, price: priceOf(S.players[pid]) });
  d.players = d.players.filter((x) => x !== pid);
}

function viewTeam() {
  if (!S.uid) return `<div class="empty"><h3>Inicia sesión para jugar</h3><p class="muted">Necesitas abrir la liga con tu cuenta de Claude para tener tu propio equipo.</p></div>`;
  if (!Object.keys(S.players).length) return `<div class="empty"><h3>Sin jugadores en el mercado</h3><p class="muted">El administrador todavía no ha añadido la plantilla.</p></div>`;
  const d = ensureDraft(); const sl = slots(); const c = cfg();
  const cash = cashOf(d.moves); const value = teamValue(d.players);
  const openMd = mdList().find((m) => !hasResult(m) && !m.lineups);
  const lockedMd = mdList().find((m) => !hasResult(m) && m.lineups);
  const readonly = S.canWrite === false;
  let html = `<section class="section"><div class="row spread"><div><div class="eyebrow">${myTeam() ? "Tu equipo" : "Crea tu equipo"}</div><h2>${esc(d.name || "Mi equipo")}</h2></div>
    <div class="row">${myTeam() ? `<span class="pts num">${managerTotal(S.uid)}</span><span class="muted">puntos</span>` : ""}</div></div>`;
  if (readonly) html += `<div class="note warn">Con tu nivel de acceso puedes ver la liga pero no guardar un equipo. Pide al administrador que te invite con permiso para editar.</div>`;
  if (lockedMd) html += `<div class="note">Las alineaciones de la J${esc(lockedMd.number)} ya están cerradas. Los cambios que guardes cuentan para la siguiente jornada.</div>`;
  else if (openMd) html += `<div class="note">Alineaciones abiertas para la J${esc(openMd.number)} vs ${esc(openMd.rival || "rival")}. Guarda antes de que el administrador las cierre.</div>`;
  html += `<div class="field" style="max-width:360px"><label for="team-name">Nombre de tu equipo</label><input id="team-name" maxlength="40" data-bind="draft.name" placeholder="Los Galácticos del Barrio" value="${esc(d.name)}"></div>
    <div class="budget ${cash < 0 ? "over" : ""}"><div><span class="eyebrow">Caja</span><b class="num">${money(cash)}</b></div><div><span class="eyebrow">Valor del equipo</span><b class="num">${money(value)}</b></div><div><span class="eyebrow">Patrimonio</span><b class="num">${money(cash + value)}</b></div></div>
    <div class="pitch" role="group" aria-label="Alineación">`;
  for (const pos of [...POS_ORDER].reverse()) {
    const ids = d.players.filter((id) => S.players[id]?.pos === pos);
    html += `<div class="line">`;
    for (let i = 0; i < sl[pos]; i++) {
      const p = S.players[ids[i]];
      if (p) html += `<button class="slot" data-act="slot-player" data-id="${esc(p.id)}" aria-label="${esc(p.name)}, opciones"><span class="avwrap">${avatar(p)}${d.captain === p.id ? `<span class="cap" title="Capitán">C</span>` : ""}</span><span class="tag">${esc(p.name)}</span><span class="price num">${money(priceOf(p))}</span></button>`;
      else html += `<button class="slot empty" data-act="slot-pick" data-pos="${pos}" aria-label="Elegir ${POS[pos].n.toLowerCase()}"><span class="avwrap"><span class="av">+</span></span><span class="tag">${pos}</span></button>`;
    }
    html += `</div>`;
  }
  const problems = teamProblems(d);
  html += `</div><div class="row spread"><span class="muted" id="team-msg">${teamMsg(d)}</span>
    <div class="row">${d.dirty ? `<button class="btn" data-act="draft-reset">Deshacer cambios</button>` : ""}<button class="btn primary" id="team-save" data-act="draft-save" ${problems.length || readonly || S.saving ? "disabled" : ""}>${myTeam() ? "Guardar cambios" : "Crear mi equipo"}</button></div></div>
    <p class="muted" style="margin:0;font-size:13px">Empiezas con ${money(c.budget)}. Fichas al precio de mercado de ese momento y, si vendes, cobras lo que valga entonces: si un compañero se sale y sube de valor, ganas dinero. El capitán puntúa doble. Puedes guardar aunque te queden huecos, pero un hueco vacío da 0 puntos.</p></section>`;
  // historial
  const hist = scoredMds().filter((md) => lineupFor(md, S.uid));
  if (hist.length) html += `<section class="section"><h3>Tus jornadas</h3><div class="tablebox"><table><thead><tr><th>Jornada</th><th>Capitán</th><th class="r">Puntos</th></tr></thead><tbody>${hist.reverse().map((md) => `<tr class="clickable" data-act="show-md-team" data-md="${esc(md.id)}" data-id="${esc(S.uid)}"><td>J${esc(md.number)} vs ${esc(md.rival || "")}</td><td>${esc(S.players[lineupFor(md, S.uid).captain]?.name || "–")}</td><td class="r">${ptsEl(managerMdPts(md, S.uid))}</td></tr>`).join("")}</tbody></table></div></section>`;
  return html;
}

function teamProblems(d) {
  const problems = []; const left = cashOf(d.moves);
  if (!d.name.trim()) problems.push("ponle nombre al equipo");
  if (!d.players.length) problems.push("ficha al menos a un jugador");
  if (left < 0) problems.push(`te faltan ${money(-left)} en caja`);
  if (d.players.length && !d.captain) problems.push("elige capitán (toca a un jugador)");
  return problems;
}
function teamMsg(d) { const pr = teamProblems(d); const n = totalSlots() - d.players.length; return pr.length ? "Para guardar: " + pr.join(", ") + "." : (d.dirty ? "Tienes cambios sin guardar." : myTeam() ? "Equipo guardado." : "") + (n > 0 ? ` Te quedan ${n} hueco${n === 1 ? "" : "s"} libres.` : ""); }
function ownership(pid) { const ts = Object.values(S.teams); if (!ts.length) return 0; return Math.round(100 * ts.filter((t) => (t.players || []).includes(pid)).length / ts.length); }

function viewMarket() {
  let ps = Object.values(S.players);
  if (!ps.length) return `<div class="empty"><h3>Mercado vacío</h3><p class="muted">Aquí estarán todos los jugadores del equipo con su precio, sus puntos y cuántos mánagers los tienen.</p></div>`;
  if (S.marketPos !== "ALL") ps = ps.filter((p) => p.pos === S.marketPos);
  const rows = ps.map((p) => ({ p, pts: seasonPts(p), own: ownership(p.id), pj: scoredMds().filter((md) => md.stats?.[p.id]?.played).length }));
  const key = S.marketSort;
  rows.sort((a, b) => key === "price" ? priceOf(b.p) - priceOf(a.p) : key === "own" ? b.own - a.own : key === "name" ? a.p.name.localeCompare(b.p.name) : b.pts - a.pts);
  const mine = new Set(myTeam()?.players || []);
  return `<section class="section"><div class="row spread"><h2>Mercado</h2>
    <div class="row"><div class="seg" role="group" aria-label="Posición">${["ALL", ...POS_ORDER].map((k) => `<button data-act="market-pos" data-v="${k}" aria-pressed="${S.marketPos === k}">${k === "ALL" ? "Todos" : k}</button>`).join("")}</div>

  }).join("")}</section>`;

function statLine(s) {
  const b = [];
  if (s.goals) b.push(`G×${s.goals}`); if (s.assists) b.push(`A×${s.assists}`);
  if (s.yellow) b.push(`<span class="yc" title="Amarilla"></span>${s.yellow > 1 ? "×" + s.yellow : ""}`); if (s.red) b.push(`<span class="rc" title="Roja"></span>`);
  if (s.mvp) b.push("MVP");
  return b.length ? "· " + b.join(" ") : "";
}

// ---------- Escrituras ----------
async function write(fn, okMsg) {
  if (S.saving) return; S.saving = true;
  try { await fn(); if (okMsg) toast(okMsg); }
  catch (e) {
    const code = e?.code;
    toast(code === "invalid_argument" ? "No tienes permiso para guardar esto." : code === "quota_exceeded" ? "La liga ha llegado al límite de datos." : "No se ha podido guardar. Inténtalo otra vez.");
    if (code === "invalid_argument" && S.canWrite !== true) S.canWrite = false;
  } finally { S.saving = false; schedule(); }
}
const actions = {
  join: () => {
    const j = S.join || {}; const name = String(j.name || "").trim(); const dorsal = parseInt(j.dorsal, 10);
    if (!name) return toast("Escribe tu nombre");
    if (!(dorsal >= 1 && dorsal <= 99)) return toast("Pon tu dorsal (de 1 a 99)");
    if (!POS[j.pos]) return toast("Elige tu posición");
    const clash = Object.values(S.signups).find((x) => x.id !== S.uid && +x.dorsal === dorsal);
    if (clash) return toast(`El dorsal ${dorsal} ya lo tiene ${clash.name}`);
    const prev = S.signups[S.uid];
    write(async () => { await S.db.doc("signups/" + S.uid).set({ name: name.slice(0, 30), dorsal: String(dorsal), pos: j.pos, joinedAt: prev?.joinedAt || new Date().toISOString() }); S.join = null; S.editJoin = false; }, prev ? "Datos guardados" : "¡Apuntado!");
  },
  "join-edit": () => { S.editJoin = true; S.join = null; render(); },
  "join-cancel": () => { S.editJoin = false; S.join = null; render(); },
  "signup-remove": (el) => {
    if (S.confirmDel !== el.dataset.id) { S.confirmDel = el.dataset.id; render(); return; }
    S.confirmDel = null; write(() => S.db.doc("signups/" + el.dataset.id).delete(), "Quitado de la lista");
  },
  "league-start": () => {
    const a = S.adminCfg; const budget = Math.max(5, +a.budget || 30);
    const price = a.startPrice === "" || !(+a.startPrice > 0) ? defaultPriceFor(budget, a.formato) : +a.startPrice;
    const su = Object.values(S.signups);
    write(async () => {
      for (const x of su) if (!S.players[x.id]) await S.db.doc("players/" + x.id).set({ name: x.name, pos: x.pos, dorsal: x.dorsal, price });
      const { startPrice, ...rest } = a;
      await S.db.doc("league/config").set({ ...(S.cfg || {}), ...rest, name: (a.name || "Liga Fantasy").slice(0, 50), club: (a.club || "").slice(0, 50), budget, started: true, startedAt: new Date().toISOString() });
      S.adminCfg = null; location.hash = "equipo";
    }, `Liga creada: ${su.length} jugadores en el mercado`);
  },
  "signups-add": () => {
    const pend = Object.values(S.signups).filter((x) => !S.players[x.id]); const price = defaultPrice();
    write(async () => { for (const x of pend) await S.db.doc("players/" + x.id).set({ name: x.name, pos: x.pos, dorsal: x.dorsal, price }); }, `${pend.length} añadidos al mercado`);
  },
  "show-player": (el) => { S.modal = { type: "player", id: el.dataset.id }; renderModal(); },
  "show-team": (el) => { S.modal = { type: "team", id: el.dataset.id }; renderModal(); },
  "show-md-team": (el) => { S.modal = { type: "mdteam", id: el.dataset.id, md: el.dataset.md }; renderModal(); },
  "close-modal": (el, ev) => { if (ev.target !== el) return; S.modal = null; S.confirmDel = null; renderModal(); },
  "slot-pick": (el) => { S.modal = { type: "pick", pos: el.dataset.pos }; renderModal(); },
  "slot-player": (el) => { S.modal = { type: "slot", id: el.dataset.id }; renderModal(); },
  pick: (el) => { const d = ensureDraft(); draftBuy(d, el.dataset.id); if (!d.captain) d.captain = el.dataset.id; d.dirty = true; S.modal = null; render(); },
  unpick: (el) => { const d = ensureDraft(); draftSell(d, el.dataset.id); if (d.captain === el.dataset.id) d.captain = null; d.dirty = true; S.modal = null; render(); },
  swap: (el) => { const p = S.players[el.dataset.id]; actions.unpick(el); S.modal = { type: "pick", pos: p.pos }; renderModal(); },
  captain: (el) => { ensureDraft().captain = el.dataset.id; S.draft.dirty = true; S.modal = null; render(); },
  "draft-reset": () => { S.draft = null; render(); },
  "draft-save": () => {
    const d = ensureDraft();
    write(async () => { await S.db.doc("teams/" + S.uid).set({ name: d.name.trim().slice(0, 40), players: d.players, captain: d.captain, moves: d.moves, updatedAt: new Date().toISOString() }); S.draft = null; }, myTeam() ? "Cambios guardados" : "Equipo creado");
  },
  "market-pos": (el) => { S.marketPos = el.dataset.v; render(); },
  "toggle-md": (el) => { S.openMd = S.openMd === el.dataset.id ? null : el.dataset.id; S.confirmDel = null; render(); },
  "md-create": () => {
    const nm = S.newMd || {}; const number = mdList().reduce((a, m) => Math.max(a, m.number || 0), 0) + 1; const id = rid("j");
    write(async () => { await S.db.doc("matchdays/" + id).set({ number, rival: (nm.rival || "").slice(0, 40), date: nm.date || "", gf: "", ga: "", stats: {} }); S.newMd = {}; S.openMd = "a:" + id; }, `Jornada ${number} creada`);
  },
  "md-save": (el) => {
    const id = el.dataset.id; const d = S.mdDraft[id];
    const stats = {}; for (const [pid, s] of Object.entries(d.stats)) { const clean = {}; for (const [k, v] of Object.entries(s)) if (v) clean[k] = typeof v === "boolean" ? v : +v; if (Object.keys(clean).length) stats[pid] = clean; }
    const { id: _omit, ...cur } = S.mds[id] || {};
    write(async () => { await S.db.doc("matchdays/" + id).set({ ...cur, rival: d.rival.slice(0, 40), date: d.date, gf: d.gf === "" ? "" : +d.gf, ga: d.ga === "" ? "" : +d.ga, stats }); delete S.mdDraft[id]; }, "Jornada guardada");
  },
  "md-lock": (el) => {
    const lineups = {};
    for (const t of Object.values(S.teams)) {
      if (!t.players?.length) continue;
      const snap = {}; for (const pid of t.players) { const p = S.players[pid]; if (p) snap[pid] = { name: p.name, pos: p.pos, dorsal: p.dorsal || "", price: priceOf(p) }; }
      lineups[t.id] = { players: t.players.filter((x) => snap[x]), captain: t.captain || null, snap };
    }
    write(() => S.db.doc("matchdays/" + el.dataset.id).update({ lineups, lockedAt: new Date().toISOString() }), `Alineaciones cerradas: ${Object.keys(lineups).length} equipos`);
  },
  "md-unlock": (el) => { write(async () => { const ref = S.db.doc("matchdays/" + el.dataset.id); const cur = (await ref.get()).data(); const { lineups, lockedAt, ...rest } = cur; await ref.set(rest); }, "Alineaciones reabiertas"); },
  "md-delete": (el) => {
    if (S.confirmDel !== el.dataset.id) { S.confirmDel = el.dataset.id; render(); return; }
    S.confirmDel = null; write(() => S.db.doc("matchdays/" + el.dataset.id).delete(), "Jornada borrada");
  },
  "player-add": () => {
    const np = S.newPlayer; if (!np.name.trim()) { toast("Escribe el nombre del jugador"); return; }
    write(async () => { await S.db.doc("players/" + rid("p")).set({ name: np.name.trim().slice(0, 40), pos: np.pos, dorsal: String(np.dorsal || "").slice(0, 3), price: np.price === "" ? defaultPrice() : +np.price }); S.newPlayer = { name: "", pos: np.pos, dorsal: "", price: "" }; }, `${np.name.trim()} añadido`);
  },
  "player-edit": (el) => { S.confirmDel = null; S.modal = { type: "edit", draft: { ...S.players[el.dataset.id] } }; renderModal(); },
  "edit-nophoto": () => { S.modal.draft.photo = null; renderModal(); },
  "player-save": () => {
    const e = S.modal.draft; if (!e.name?.trim()) { toast("El nombre no puede quedar vacío"); return; }
    const { id, ...rest } = e;
    write(async () => { await S.db.doc("players/" + id).set({ ...rest, name: e.name.trim().slice(0, 40), price: +e.price || 0, dorsal: String(e.dorsal || "").slice(0, 3), photo: e.photo || null }); S.modal = null; }, "Jugador guardado");
  },
  "player-delete": (el) => {
    if (S.confirmDel !== el.dataset.id) { S.confirmDel = el.dataset.id; renderModal(); return; }
    S.confirmDel = null; write(async () => { await S.db.doc("players/" + el.dataset.id).delete(); S.modal = null; }, "Jugador borrado");
  },
  "cfg-save": () => {
    const a = S.adminCfg;
    write(async () => { const { startPrice, ...rest } = a; await S.db.doc("league/config").set({ ...(S.cfg || {}), ...rest, name: (a.name || "Liga Fantasy").slice(0, 50), club: (a.club || "").slice(0, 50), formato: a.formato, budget: Math.max(5, +a.budget || 30) }); S.adminCfg = null; }, "Ajustes guardados");
  },
};

document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const fn = actions[el.dataset.act]; if (!fn) return;
  if (el.dataset.act !== "close-modal") ev.preventDefault();
  fn(el, ev);
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && S.modal) { S.modal = null; renderModal(); }
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches?.('[role="button"][data-act]')) { ev.preventDefault(); ev.target.click(); }
});
function setPath(path, value) {
  const keys = path.split("."); let o = S;
  for (let i = 0; i < keys.length - 1; i++) { o = o[keys[i]] ||= {}; }
  o[keys[keys.length - 1]] = value;
}
document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.dataset.bind) {
    setPath(t.dataset.bind, t.value);
    if (t.dataset.bind === "draft.name" && S.draft) {
      S.draft.dirty = true; $("#team-msg").textContent = teamMsg(S.draft);
      $("#team-save").disabled = teamProblems(S.draft).length > 0 || S.canWrite === false;
    }
  }
  if (t.dataset.stat) {
    const [mid, pid, k] = t.dataset.stat.split("|"); const d = S.mdDraft[mid];
    const s = d.stats[pid] ||= {};
    s[k] = t.type === "checkbox" ? t.checked : t.value;
    if (k !== "played" && t.type !== "checkbox" && +t.value && !s.played) { s.played = true; const pc = t.closest("tr").querySelector('[aria-label="played"]'); if (pc) pc.checked = true; }
    const p = S.players[pid]; const cell = t.closest("tr").lastElementChild;
    if (p && cell) cell.textContent = playerPts(p, d);
  }
});
document.addEventListener("change", async (ev) => {
  const t = ev.target;
  if (t.dataset.actChange === "market-sort") { S.marketSort = t.value; t.blur(); render(); }
  if (t.tagName === "SELECT" && t.dataset.bind) { t.blur(); render(); }
  if (t.id === "ed-photo" && t.files?.[0] && S.assets) {
    const f = t.files[0];
    if (f.size > 8 * 1024 * 1024) { toast("La foto pesa demasiado: máximo 8 MB."); return; }
    toast("Subiendo foto…");
    try { const r = await S.assets.upload(f); S.modal.draft.photo = r.id; renderModal(); toast("Foto lista. Pulsa Guardar."); }
    catch { toast("No se ha podido subir la foto."); }
  }
});
window.addEventListener("hashchange", () => { S.modal = null; window.scrollTo(0, 0); render(); });
render();
boot();
})();
</script>
